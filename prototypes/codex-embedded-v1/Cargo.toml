[package]
name = "light-codex-embedded-probe"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Keep the experimental upstream graph out of the light-fabric workspace. It is
# intentionally compiled only by the explicit Phase 5 probe.
[workspace]

[dependencies]
codex-core = { git = "https://github.com/openai/codex.git", rev = "657a993cbee87acf52d14b758ce49dbd46d1b8eb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# codex-core depends on upstream workspace patches. Cargo does not inherit
# patches from a git dependency, so the probe pins the same revisions.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
