name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: light-fabric-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Checkout public Workflow admin fixtures
        uses: actions/checkout@v7
        with:
          repository: lightapi/light-portal-test
          path: light-portal-test
      - name: Place Workflow admin fixtures beside Light-Fabric
        run: mv light-portal-test ../light-portal-test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/light-workflow/contracts/workflow-admin/package-lock.json
      - name: Validate Workflow admin contracts
        working-directory: apps/light-workflow/contracts/workflow-admin
        run: npm ci --ignore-scripts && npm test
      - name: Shared client template parity
        run: python3 scripts/sync-client-config.py --check
      - name: Image build orchestration
        run: python3 scripts/test_select_changed_apps.py && scripts/test-build.sh
      - name: Install worker test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap
      - name: Allow Bubblewrap user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
        # Allow the sandbox launcher on this CI VM and keep the global restriction.
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap
      - name: Verify worker namespace support
        # Worker tests exercise real filesystem and process isolation.
        run: |
          /usr/bin/bwrap --die-with-parent --new-session \
            --unshare-pid --unshare-ipc --unshare-uts \
            --ro-bind / / --dev /dev --proc /proc /bin/true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Unit and deterministic integration tests
        run: cargo test --workspace --locked

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # agent-postgres GRANTs against roles and schemas it does not create, so the
      # metadata bundle has to be applied first.
      - name: Bootstrap operational schema
        env:
          PGPASSWORD: postgres
        run: |
          for file in crates/operational-store/migrations/metadata-postgres/*.sql \
                      crates/agent-store/migrations/agent-postgres/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d operations -f "$file"
          done
      # These are #[ignore]d so that a run without a database reports them as
      # skipped rather than passing without executing.
      - name: Database-backed tests
        env:
          LIGHT_AGENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/operations
          LIGHT_AGENT_TEST_SCHEMA: agent_ops
        run: >-
          cargo test --locked -p light-agent --lib
          durable_admission_is_idempotent_fifo_and_projection_rebuildable
          -- --ignored

      - name: Session expiry during execution outage
        env:
          LIGHT_AGENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/operations
        run: cargo test --locked -p light-agent --lib reconciliation_expires_sessions_when_execution_is_unavailable -- --ignored
      # Completion regressions create UUID-named child databases and apply the
      # repository Workflow migrations there. The base is fixture-only.
      - name: Hindsight vector binding and recall
        env:
          HINDSIGHT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/operations
        run: cargo test --locked -p hindsight-client --test postgres -- --ignored

  workflow-retry-and-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: retry_fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: p01_timer_gate
        ports:
          - 55431:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1073741824
          --health-cmd "pg_isready -U retry_fixture_admin -d p01_timer_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create isolated Workflow scratch prerequisites
        env:
          PGPASSWORD: fixture_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55431 -U retry_fixture_admin -d p01_timer_gate <<'SQL'
          CREATE ROLE operations_workflow_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE operations_workflow_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE workflow_retry_ci;
          SQL
      - name: Workflow durable HTTP retry regressions
        env:
          HTTP_RETRY_TEST_ADMIN_URL: postgres://retry_fixture_admin:fixture_only@127.0.0.1:55431/workflow_retry_ci
        run: >-
          cargo test --locked -p light-workflow --lib executor::http_retry_tests::
          -- --ignored --test-threads=1
      - name: P01 durable timer regressions
        env:
          P01_TIMER_TEST_DATABASE_URL: postgres://retry_fixture_admin:fixture_only@127.0.0.1:55431/p01_timer_gate
        run: >-
          cargo test --locked -p light-workflow --lib executor::durable_timer_tests::
          -- --ignored --test-threads=1

  runner-image-and-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build runner image
        run: docker build --file apps/light-workflow-runner/docker/Dockerfile --tag light-workflow-runner:ci .
      - uses: azure/setup-kubectl@v4
      - name: Render Kubernetes resources
        run: kubectl kustomize apps/light-workflow-runner/k8s > /tmp/light-workflow-runner.yaml
      - name: Reject example secrets from deployable resources
        run: |
          if grep -E "replace-with-short-lived-runner-jwt|replace-with-cube-api-key" /tmp/light-workflow-runner.yaml; then
            exit 1
          fi
