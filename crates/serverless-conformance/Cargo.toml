[package]
name = "serverless-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jsonschema.workspace = true
light-lambda = { path = "../../apps/light-lambda" }
light-runtime = { path = "../../crates/light-runtime" }
light-security = { path = "../../crates/light-security" }
light-lambda-runtime = { path = "../../frameworks/light-lambda-runtime" }
serverless-core = { path = "../serverless-core", features = ["conformance"] }
serverless-aws = { path = "../serverless-aws" }
lambda_runtime.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
axum.workspace = true
http.workspace = true
aws-sdk-lambda.workspace = true
percent-encoding = "2"
url.workspace = true
base64.workspace = true
jsonwebtoken = "9.3"
rsa = "0.9"
futures-util.workspace = true
tracing-subscriber.workspace = true

tracing.workspace = true

axum-server = { version = "0.7.3", features = ["tls-rustls"] }
rcgen = "0.14.8"

rustls = { version = "0.23.37", features = ["ring"] }

bytes.workspace = true

[dev-dependencies]
# Test targets explicitly activate synthetic insecure prerequisites. Ordinary
# workspace builds and deployable bootstrap builds do not enable this feature.
light-lambda-runtime = { path = "../../frameworks/light-lambda-runtime", features = ["insecure-test-config"] }
