[package]
name = "workflow-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Authoritative PostgreSQL contract and scope validation for Workflow operational state"

[lib]
path = "src/lib.rs"

[dependencies]
