[package]
edition = "2021"
rust-version = "1.85.0"
name = "light-lambda-precision-jsonschema"
version = "0.48.0"
authors = ["Dmitry Dygalo <dmitry@dygalo.dev>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "JSON schema validaton library"
readme = "README.md"
keywords = [
    "jsonschema",
    "validation",
]
categories = ["web-programming"]
license = "MIT"
repository = "https://github.com/Stranger6667/jsonschema"
resolver = "3"

[features]
arbitrary-precision = [
    "serde_json/arbitrary_precision",
    "dep:num-bigint",
    "jsonschema-macros?/arbitrary-precision",
]
default = [
    "resolve-http",
    "resolve-file",
    "tls-aws-lc-rs",
]
macros = [
    "dep:jsonschema-macros",
    "jsonschema-macros/float-roundtrip",
]
resolve-async = [
    "referencing/retrieve-async",
    "reqwest",
    "dep:async-trait",
    "dep:tokio",
]
resolve-file = []
resolve-http = [
    "reqwest",
    "dep:rustls",
]
tls-aws-lc-rs = ["rustls/aws-lc-rs"]
tls-ring = ["rustls/ring"]

[lib]
test = false
doctest = false
name = "jsonschema"
path = "src/lib.rs"

[dependencies.ahash]
version = "0.8"
features = ["serde"]

[dependencies.async-trait]
version = "0.1.86"
optional = true

[dependencies.bytecount]
version = "0.6"
features = ["runtime-dispatch-simd"]

[dependencies.data-encoding]
version = "2.9"

[dependencies.email_address]
version = "0.2.9"

[dependencies.fancy-regex]
version = "0.18"

[dependencies.fraction]
version = "0.15"
features = ["with-bigint"]
default-features = false

[dependencies.idna]
version = "1.0.2"

[dependencies.itoa]
version = "1"

[dependencies.jsonschema-macros]
version = "0.48.0"
optional = true

[dependencies.jsonschema-regex]
version = "0.48.0"

[dependencies.num-bigint]
version = "0.4"
optional = true

[dependencies.num-cmp]
version = "0.1"

[dependencies.num-traits]
version = "0.2.19"

[dependencies.percent-encoding]
version = "2.3"

[dependencies.referencing]
package = "light-lambda-precision-referencing"
path = "../referencing"
version = "0.48.0"

[dependencies.regex]
version = "1.11.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
package = "light-lambda-precision-json"
path = "../json"
version = "1"
features = [
    "float_roundtrip",
    "unbounded_depth",
]

[dependencies.tokio]
version = "1"
features = ["rt"]
optional = true
default-features = false

[dependencies.unicode-general-category]
version = "1.1"

[dependencies.uuid-simd]
version = "0.8"
features = [
    "std",
    "detect",
]
default-features = false

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies.reqwest]
version = "0.13"
features = ["json"]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
features = [
    "blocking",
    "json",
    "http2",
    "rustls-no-provider",
]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rustls]
version = "0.23"
features = [
    "std",
    "tls12",
]
optional = true
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3.4"
features = ["wasm_js"]


[workspace]
