# Handler middleware chain configuration
#----------------------------------------
enabled: ${handler.enabled:true}
# Unsupported duration reporting: false is warned; true fails Init.
reportHandlerDuration: ${handler.reportHandlerDuration:false}

# Base Path of the API endpoints
basePath: ${handler.basePath:/}

#------------------------------------------------------------------------------
# Support individual handler chains for each separate endpoint. It allows framework
# handlers like health check, server info to bypass majority of the middleware handlers
# and allows mixing multiple frameworks like OpenAPI and GraphQL in the same instance.
#
# handlers  --  list of handlers to be used across chains in this microservice
#               including the routing handlers for ALL endpoints
#           --  format: fully qualified handler class name@optional:given name
# chains    --  allows forming of [1..N] chains, which could be wholly or
#               used to form handler chains for each endpoint
#               ex.: default chain below, reused partially across multiple endpoints
# paths     --  list all the paths to be used for routing within the microservice
#           ----  path: the URI for the endpoint (ex.: path: '/v1/pets')
#           ----  method: the operation in use (ex.: 'post')
#           ----  exec: handlers to be executed -- this element forms the list and
#                       the order of execution for the handlers
#
# IMPORTANT NOTES:
# - to avoid executing a handler, it has to be removed/commented out in the chain
#   or change the enabled:boolean to false for a middleware handler configuration.
# - all handlers, routing handler included, are to be listed in the execution chain
# - for consistency, give a name to each handler; it is easier to refer to a name
#   vs a fully qualified class name and is more elegant
# - you can list in chains the fully qualified handler class names, and avoid using the
#   handlers element altogether
#------------------------------------------------------------------------------
handlers: ${handler.handlers:["com.networknt.aws.lambda.handler.middleware.metrics.APMMetricsMiddleware@metrics","com.networknt.aws.lambda.handler.middleware.limit.LimitMiddleware@limit","com.networknt.aws.lambda.handler.middleware.traceability.TraceabilityMiddleware@traceability","com.networknt.aws.lambda.handler.middleware.correlation.CorrelationMiddleware@correlation","com.networknt.aws.lambda.handler.middleware.cors.RequestCorsMiddleware@requestCors","com.networknt.aws.lambda.handler.middleware.header.RequestHeaderMiddleware@requestHeader","com.networknt.aws.lambda.handler.middleware.transformer.RequestTransformerMiddleware@requestTransformer","com.networknt.aws.lambda.handler.middleware.audit.AuditMiddleware@audit","com.networknt.aws.lambda.handler.middleware.token.TokenMiddleware@token","com.networknt.aws.lambda.handler.middleware.router.LambdaRouterMiddleware@router","com.networknt.aws.lambda.handler.middleware.specification.OpenApiMiddleware@specification","com.networknt.aws.lambda.handler.middleware.security.UnifiedSecurityMiddleware@security","com.networknt.aws.lambda.handler.middleware.sanitizer.SanitizerMiddleware@sanitizer","com.networknt.aws.lambda.handler.middleware.validator.ValidatorMiddleware@validator","com.networknt.aws.lambda.handler.middleware.header.ResponseHeaderMiddleware@responseHeader","com.networknt.aws.lambda.handler.middleware.cors.ResponseCorsMiddleware@responseCors","com.networknt.aws.lambda.handler.middleware.transformer.ResponseTransformerMiddleware@responseTransformer","com.networknt.aws.lambda.handler.middleware.proxy.LambdaProxyMiddleware@proxy","com.networknt.aws.lambda.handler.health.HealthCheckHandler@health","com.networknt.aws.lambda.handler.info.ServerInfoHandler@info","com.networknt.aws.lambda.handler.logger.LoggerGetHandler@getLogger","com.networknt.aws.lambda.handler.logger.LoggerSetHandler@setLogger","com.networknt.aws.lambda.handler.cache.CacheExplorerHandler@cache","com.networknt.aws.lambda.handler.middleware.security.JwtVerifyMiddleware@jwt","com.networknt.aws.lambda.handler.middleware.security.SwtVerifyMiddleware@swt","com.networknt.aws.lambda.handler.middleware.security.BasicAuthMiddleware@basic","com.networknt.aws.lambda.handler.middleware.security.ApiKeyMiddleware@apikey"]}

additionalHandlers: ${handler.additionalHandlers:}

chains:
  request:
    - metrics
    - limit
    - traceability
    - correlation
    - requestCors
    - requestHeader
    - requestTransformer
    - audit
    - token
    - router
    - specification
    - security
    - sanitizer
    - validator
  response:
    - responseHeader
    - responseCors
    - responseTransformer

  admin:
    - correlation
    - specification
    - security
    - validator

additionalChains: ${handler.additionalChains:}

# Phase-1 local endpoints are reserved by the app guard and return 404.
paths: []

additionalPaths: ${handler.additionalPaths:}
defaultHandlers:
  - request
  - proxy
  - response
