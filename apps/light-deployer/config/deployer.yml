deployerId: ${deployer.deployerId:local-light-deployer}
clusterId: ${deployer.clusterId:local}
allowedNamespaces: []
allowedRepoHosts: []
allowedRepoPrefixes: []
allowedImageRegistries: []
devInsecure: ${deployer.devInsecure:false}
prune:
  enabled: ${deployer.prune.enabled:true}
  maxDeletePercent: ${deployer.prune.maxDeletePercent:30}
  sensitiveKinds:
    - PersistentVolumeClaim
  overrideRequired: ${deployer.prune.overrideRequired:true}
operationalStore:
  contractVersion: ${operationalStore.contractVersion:2}
  bindingId: ${operationalStore.bindingId:}
  bindingDigest: ${operationalStore.bindingDigest:}
  hostId: ${operationalStore.hostId:}
  environment: ${operationalStore.environment:dev}
  serverHost: ${operationalStore.serverHost:postgres}
  port: ${operationalStore.port:5432}
  tlsMode: ${operationalStore.tlsMode:DISABLE}
  serviceOwner: ${operationalStore.serviceOwner:light-deployer}
  schema: ${operationalStore.schema:operational_meta}
  expectedDatabase: ${operationalStore.expectedDatabase:operations}
  minimumSchemaGeneration: ${operationalStore.minimumSchemaGeneration:2}
  databaseUrlFile: ${operationalStore.databaseUrlFile:/run/secrets/operational-database-url}
  credentialGeneration: ${operationalStore.credentialGeneration:1}
