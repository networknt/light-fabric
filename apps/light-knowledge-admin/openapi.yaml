openapi: 3.0.3
info:
  title: Light Knowledge Administration API
  version: 1.0.0
  description: Private delegated-user API for bounded Knowledge operational administration.
x-field-contract: operational-field-allowlists-v1
x-cursor-contract: operational-cursor-keys-v1
servers:
  - url: http://light-knowledge-admin:8093
tags:
  - name: Administration
paths:
  /health:
    get:
      operationId: lightKnowledgeAdminHealth
      security: []
      responses:
        '200': {$ref: '#/components/responses/HealthSuccess'}
  /ready:
    get:
      operationId: lightKnowledgeAdminReadiness
      security: []
      responses:
        '200': {$ref: '#/components/responses/HealthSuccess'}
        '503': {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      operationId: lightKnowledgeAdminMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics with fixed route labels only.
          content:
            text/plain:
              schema: {type: string}
  /v1/knowledge/admin/commands:
    post:
      tags: [Administration]
      operationId: submitKnowledgeOperationalCommand
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationalCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/control-snapshots:apply:
    post:
      tags: [Administration]
      operationId: applyKnowledgeControlSnapshot
      description: Applies a complete signed audience snapshot with a 64 MiB request bound and a 120 second deadline.
      security: [{delegatedUserBearer: []}]
      parameters: [{$ref: '#/components/parameters/Environment'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlSnapshotEnvelope'}
      responses:
        '200': {$ref: '#/components/responses/SnapshotSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-base-summaries:batch:
    post:
      tags: [Administration]
      operationId: getKnowledgeBaseSummaries
      security: [{delegatedUserBearer: []}]
      parameters: [{$ref: '#/components/parameters/Environment'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeBaseBatch'}
      responses:
        '200': {$ref: '#/components/responses/SummariesSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/source-status:batch:
    post:
      tags: [Administration]
      operationId: getKnowledgeSourceStatus
      security: [{delegatedUserBearer: []}]
      parameters: [{$ref: '#/components/parameters/Environment'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceBatch'}
      responses:
        '200': {$ref: '#/components/responses/SourceStatusSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/sync-runs:
    get:
      tags: [Administration]
      operationId: getKnowledgeSyncRuns
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/documents:
    get:
      tags: [Administration]
      operationId: getKnowledgeDocuments
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-generations:
    get:
      tags: [Administration]
      operationId: getKnowledgeIndexGenerations
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-segments:
    get:
      tags: [Administration]
      operationId: getKnowledgeIndexSegments
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-generations/{generationId}/segments:
    get:
      tags: [Administration]
      operationId: getKnowledgeIndexGenerationSegments
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - name: generationId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/incremental-operations:
    get:
      tags: [Administration]
      operationId: getKnowledgeIncrementalOperations
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: uploadsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: changesCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: anchorsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: compactionsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: antiEntropyCursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/acl-status:
    get:
      tags: [Administration]
      operationId: getKnowledgeAclStatus
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: aclFreshnessCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: aclReconciliationsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: aclTransitionsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: connectorObjectsCursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/production-operations:
    get:
      tags: [Administration]
      operationId: getKnowledgeProductionOperations
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: embeddingMigrationsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: migrationEvaluationsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: generationRetentionCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: backupCheckpointsCursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: purgeEvidenceCursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/promotion-receipts:
    get:
      tags: [Administration]
      operationId: getKnowledgePromotionReceipts
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/OperationalSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/embedding-migration-estimates:
    post:
      tags: [Administration]
      operationId: estimateKnowledgeEmbeddingMigration
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstimateRequest'}
      responses:
        '200': {$ref: '#/components/responses/EstimateSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/authorization-simulations:
    post:
      tags: [Administration]
      operationId: simulateKnowledgeAuthorization
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Environment'}
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRequest'}
      responses:
        '200': {$ref: '#/components/responses/SimulationSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    delegatedUserBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Environment:
      name: X-Knowledge-Environment
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 16}
    KnowledgeBaseId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 200}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
  schemas:
    OperationalCommand:
      type: object
      additionalProperties: false
      required: [action, data]
      properties:
        action: {type: string, minLength: 1, maxLength: 128}
        data: {type: object}
    ControlSnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [payload, payloadDigest, signature]
      properties:
        payload:
          type: string
          description: Base64url-encoded control snapshot payload.
        payloadDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        signature: {type: string, pattern: '^[a-f0-9]{64}$'}
    KnowledgeBaseBatch:
      type: object
      additionalProperties: false
      required: [knowledgeBaseIds]
      properties:
        knowledgeBaseIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    SourceBatch:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, sourceIds]
      properties:
        knowledgeBaseId: {type: string, format: uuid}
        sourceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    EstimateRequest:
      type: object
      additionalProperties: false
      required: [targetProfileId, targetProfileRevision]
      properties:
        targetProfileId: {type: string, format: uuid}
        targetProfileRevision: {type: integer, format: int64, minimum: 1}
    SimulationRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId]
      properties:
        subjectType: {type: string, enum: [USER, GROUP, ORGANIZATION]}
        subjectId: {type: string, minLength: 1, maxLength: 255}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [UP]}
    ConfigurationMetadata:
      type: object
      additionalProperties: false
      required: [snapshotId, publicationSequence, payloadDigest, appliedTs, leaseExpiresTs]
      properties:
        snapshotId: {type: string, format: uuid}
        publicationSequence: {type: integer, format: int64, minimum: 0}
        payloadDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        appliedTs: {type: string, format: date-time}
        leaseExpiresTs: {type: string, format: date-time}
    PaginationEntry:
      type: object
      additionalProperties: false
      required: [hasMore, nextCursor]
      properties:
        hasMore: {type: boolean}
        nextCursor: {type: string, nullable: true, maxLength: 2048}
    SafeOperationalRecord:
      description: >-
        A row restricted to the named operational-field-allowlists-v1 contract.
        The implementation and CI conformance gate reject fields outside the
        resource-specific allowlist before serialization.
      type: object
      maxProperties: 40
      additionalProperties:
        nullable: true
        oneOf:
          - {type: string, maxLength: 32768}
          - {type: integer, format: int64}
          - {type: number}
          - {type: boolean}
          - {type: object, maxProperties: 64}
          - {type: array, maxItems: 64}
    OperationalResponse:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, environment, ownerScope, configuration, asOf, pagination]
      properties:
        knowledgeBaseId: {type: string, format: uuid}
        environment: {type: string, maxLength: 16}
        ownerScope: {type: string, enum: [TENANT, GLOBAL]}
        configuration: {$ref: '#/components/schemas/ConfigurationMetadata'}
        asOf: {type: string, format: date-time}
        pagination:
          type: object
          additionalProperties: {$ref: '#/components/schemas/PaginationEntry'}
        knowledgeSyncRuns: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeDocuments: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeIndexGenerations: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeIndexSegments: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeUploads: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeIncrementalChanges: {$ref: '#/components/schemas/OperationalRows'}
        knowledgePassageAnchors: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeCompactionRuns: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeAntiEntropyRuns: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeAclFreshness: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeAclReconciliations: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeAclTransitions: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeConnectorObjects: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeBaseEmbeddingMigrations: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeMigrationEvaluations: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeGenerationRetention: {$ref: '#/components/schemas/OperationalRows'}
        knowledgeBackupCheckpoints: {$ref: '#/components/schemas/OperationalRows'}
        knowledgePurgeEvidence: {$ref: '#/components/schemas/OperationalRows'}
        knowledgePromotionReceipts: {$ref: '#/components/schemas/OperationalRows'}
    OperationalRows:
      type: array
      maxItems: 200
      items: {$ref: '#/components/schemas/SafeOperationalRecord'}
    CommandResult:
      type: object
      additionalProperties: false
      required: [jobId, jobType, state, createdTs, idempotentReplay]
      properties:
        jobId: {type: string, format: uuid}
        jobType: {type: string, maxLength: 64}
        state: {type: string, maxLength: 32}
        createdTs: {type: string, format: date-time}
        idempotentReplay: {type: boolean}
    SnapshotResult:
      type: object
      additionalProperties: false
      required: [snapshotId, publicationSequence, state, idempotentReplay]
      properties:
        snapshotId: {type: string, format: uuid}
        publicationSequence: {type: integer, format: int64, minimum: 0}
        state: {type: string, enum: [APPLIED]}
        idempotentReplay: {type: boolean}
    KnowledgeBaseSummary:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, ownerScope, effectiveState, activeGenerationId, hasActiveSync, activeJobCount]
      properties:
        knowledgeBaseId: {type: string, format: uuid}
        ownerScope: {type: string, nullable: true, enum: [TENANT, GLOBAL, null]}
        version: {type: integer, format: int64}
        desiredStatus: {type: string}
        effectiveState: {type: string, enum: [AVAILABLE, NOT_YET_APPLIED]}
        activeGenerationId: {type: string, nullable: true, format: uuid}
        pointerVersion: {type: integer, nullable: true, format: int64}
        generationState: {type: string, nullable: true}
        finalWatermark: {type: integer, nullable: true, format: int64}
        hasActiveSync: {type: boolean}
        activeJobCount: {type: integer, format: int64, minimum: 0, maximum: 1000}
        latestJobState: {type: string, nullable: true}
    SummariesResponse:
      type: object
      additionalProperties: false
      required: [knowledgeBaseSummaries, environment, configuration, asOf]
      properties:
        knowledgeBaseSummaries:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/KnowledgeBaseSummary'}
        environment: {type: string, maxLength: 16}
        configuration: {$ref: '#/components/schemas/ConfigurationMetadata'}
        asOf: {type: string, format: date-time}
    SourceStatus:
      type: object
      additionalProperties: false
      required: [sourceId, latestSyncRunId, latestSyncState, lastSuccessfulSyncTs, lastSuccessfulGenerationId, updateTs]
      properties:
        sourceId: {type: string, format: uuid}
        latestSyncRunId: {type: string, nullable: true, format: uuid}
        latestSyncState: {type: string, nullable: true}
        lastSuccessfulSyncTs: {type: string, nullable: true, format: date-time}
        lastSuccessfulGenerationId: {type: string, nullable: true, format: uuid}
        updateTs: {type: string, nullable: true, format: date-time}
    SourceStatusResponse:
      type: object
      additionalProperties: false
      required: [knowledgeSourceStatus, knowledgeBaseId, environment, ownerScope, configuration, asOf]
      properties:
        knowledgeSourceStatus:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/SourceStatus'}
        knowledgeBaseId: {type: string, format: uuid}
        environment: {type: string, maxLength: 16}
        ownerScope: {type: string, enum: [TENANT, GLOBAL]}
        configuration: {$ref: '#/components/schemas/ConfigurationMetadata'}
        asOf: {type: string, format: date-time}
    EstimateResult:
      type: object
      additionalProperties: false
      required: [sourceGenerationId, targetProfileId, targetProfileRevision, targetSpaceId, targetSpaceRevision, targetDimension, estimatedChunkCount, estimatedTokenCount, estimatedCostMicros, estimatedDurationSeconds, estimatedTemporaryBytes, blockingConditions]
      properties:
        sourceGenerationId: {type: string, format: uuid}
        targetProfileId: {type: string, format: uuid}
        targetProfileRevision: {type: integer, format: int64}
        targetSpaceId: {type: string, format: uuid}
        targetSpaceRevision: {type: integer, format: int64}
        targetDimension: {type: integer}
        estimatedChunkCount: {type: integer, format: int64, minimum: 0}
        estimatedTokenCount: {type: integer, format: int64, minimum: 0}
        estimatedCostMicros: {type: integer, format: int64, minimum: 0}
        estimatedDurationSeconds: {type: integer, format: int64, minimum: 1}
        estimatedTemporaryBytes: {type: integer, format: int64, minimum: 0}
        blockingConditions: {type: array, maxItems: 32, items: {type: string}}
    EstimateResponse:
      type: object
      additionalProperties: false
