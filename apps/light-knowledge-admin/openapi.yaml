openapi: 3.1.0
info:
  title: Light Knowledge Administration API
  version: 1.0.0
  description: Private delegated-user API for bounded Knowledge operational administration.
servers:
  - url: http://light-knowledge-admin:8093
tags:
  - name: Administration
paths:
  /v1/knowledge/admin/commands:
    post:
      tags: [Administration]
      operationId: submitKnowledgeOperationalCommand
      security: [{delegatedUserBearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationalCommand'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/control-snapshots:apply:
    post:
      tags: [Administration]
      operationId: applyKnowledgeControlSnapshot
      security: [{delegatedUserBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlSnapshotEnvelope'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-base-summaries:batch:
    post:
      tags: [Administration]
      operationId: getKnowledgeBaseSummaries
      security: [{delegatedUserBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeBaseBatch'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/source-status:batch:
    post:
      tags: [Administration]
      operationId: getKnowledgeSourceStatus
      security: [{delegatedUserBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceBatch'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/sync-runs:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/documents:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-generations:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-segments:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/index-generations/{generationId}/segments:
    get:
      tags: [Administration]
      operationId: getKnowledgeIndexGenerationSegments
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - name: generationId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/incremental-operations:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/acl-status:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/production-operations:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/promotion-receipts:
    get: {$ref: '#/components/pathItems/PagedRead'}
  /v1/knowledge/admin/knowledge-bases/{id}/embedding-migration-estimates:
    post:
      tags: [Administration]
      operationId: estimateKnowledgeEmbeddingMigration
      security: [{delegatedUserBearer: []}]
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstimateRequest'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/knowledge/admin/knowledge-bases/{id}/authorization-simulations:
    post:
      tags: [Administration]
      operationId: simulateKnowledgeAuthorization
      security: [{delegatedUserBearer: []}]
      parameters: [{$ref: '#/components/parameters/KnowledgeBaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRequest'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    delegatedUserBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    KnowledgeBaseId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 200}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
  schemas:
    OperationalCommand:
      type: object
      additionalProperties: false
      required: [action, data]
      properties:
        action: {type: string, minLength: 1, maxLength: 128}
        data: {type: object}
    ControlSnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [payload, payloadDigest, signature]
      properties:
        payload: {type: string, contentEncoding: base64url}
        payloadDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        signature: {type: string, pattern: '^[a-f0-9]{64}$'}
    KnowledgeBaseBatch:
      type: object
      additionalProperties: false
      required: [knowledgeBaseIds]
      properties:
        knowledgeBaseIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    SourceBatch:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, sourceIds]
      properties:
        knowledgeBaseId: {type: string, format: uuid}
        sourceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    EstimateRequest:
      type: object
      additionalProperties: false
      required: [targetProfileId, targetProfileRevision]
      properties:
        targetProfileId: {type: string, format: uuid}
        targetProfileRevision: {type: integer, format: int64, minimum: 1}
    SimulationRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId]
      properties:
        subjectType: {type: string, enum: [USER, GROUP, ORGANIZATION]}
        subjectId: {type: string, minLength: 1, maxLength: 255}
    Error:
      type: object
      additionalProperties: false
      required: [statusCode, code, message]
      properties:
        statusCode: {type: integer}
        code: {type: string}
        message: {type: string}
  responses:
    JsonSuccess:
      description: Bounded typed administration response.
      content: {application/json: {schema: {type: object}}}
    Error:
      description: Stable error response.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  pathItems:
    PagedRead:
      tags: [Administration]
      security: [{delegatedUserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {$ref: '#/components/responses/JsonSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
