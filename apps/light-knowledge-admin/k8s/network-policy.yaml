apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: light-knowledge-admin-private
spec:
  podSelector:
    matchLabels: {app: light-knowledge-admin}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: genai-query}
        - podSelector:
            matchLabels: {app: genai-command}
        - podSelector:
            matchLabels: {app: knowledge-control-snapshot-sync}
      ports:
        - {protocol: TCP, port: 8093}
