apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-control-snapshot-sync
data:
  sync.sh: |
    #!/bin/sh
    set -eu
    case "$SNAPSHOT_AUTHORIZATION" in
      Bearer\ *) authorization="$SNAPSHOT_AUTHORIZATION" ;;
      *) authorization="Bearer $SNAPSHOT_AUTHORIZATION" ;;
    esac
    while true; do
      snapshot_file="$(mktemp)"
      trap 'rm -f "$snapshot_file"' EXIT HUP INT TERM
      curl --fail --silent --show-error --cacert "$SNAPSHOT_CACERT" --get \
        --connect-timeout 2 --max-time 10 --retry 30 --retry-all-errors --retry-delay 2 \
        -H "Authorization: $authorization" \
        --data-urlencode "cmd={\"host\":\"lightapi.net\",\"service\":\"genai\",\"action\":\"getKnowledgeAudienceSnapshot\",\"version\":\"0.1.0\",\"data\":{\"environment\":\"$SNAPSHOT_ENVIRONMENT\"}}" \
        "$SNAPSHOT_QUERY_URL" >"$snapshot_file"
      curl --fail --silent --show-error \
        --connect-timeout 2 --max-time 10 --retry 3 --retry-all-errors --retry-delay 1 \
        -H "Authorization: $authorization" \
        -H "X-Knowledge-Environment: $SNAPSHOT_ENVIRONMENT" \
        -H "Content-Type: application/json" \
        --data-binary "@$snapshot_file" "$SNAPSHOT_APPLY_URL"
      rm -f "$snapshot_file"
      trap - EXIT HUP INT TERM
      sleep "$SNAPSHOT_REFRESH_SECONDS"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-control-snapshot-sync
spec:
  replicas: 1
  selector:
    matchLabels: {app: knowledge-control-snapshot-sync}
  template:
    metadata:
      labels: {app: knowledge-control-snapshot-sync}
    spec:
      containers:
        - name: sync
          image: curlimages/curl:8.12.1
          command: ["/opt/light-knowledge/sync.sh"]
          env:
            - name: SNAPSHOT_AUTHORIZATION
              valueFrom:
                secretKeyRef: {name: knowledge-control-snapshot-sync, key: authorization}
            - {name: SNAPSHOT_ENVIRONMENT, value: dev}
            - {name: SNAPSHOT_REFRESH_SECONDS, value: "60"}
            - {name: SNAPSHOT_QUERY_URL, value: "https://hybrid-query:8440/portal/query"}
            - {name: SNAPSHOT_APPLY_URL, value: "http://light-knowledge-admin:8093/v1/knowledge/admin/control-snapshots:apply"}
            - {name: SNAPSHOT_CACERT, value: /etc/portal-ca/ca.pem}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - {name: script, mountPath: /opt/light-knowledge, readOnly: true}
            - {name: scratch, mountPath: /tmp}
            - {name: portal-ca, mountPath: /etc/portal-ca, readOnly: true}
      volumes:
        - name: script
          configMap: {name: knowledge-control-snapshot-sync, defaultMode: 0555}
        - name: scratch
          emptyDir: {}
        - name: portal-ca
          secret: {secretName: portal-ca}
