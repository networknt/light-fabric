[package]
name = "light-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[[bin]]
name = "validator-lambda-qualification"
path = "src/bin/validator_lambda_qualification.rs"
test = false
bench = false

[[bin]]
name = "validator-shutdown-extension"
path = "src/bin/validator_shutdown_extension.rs"
test = false
bench = false

[dependencies]
futures-util.workspace = true
light-lambda-runtime = { path = "../../frameworks/light-lambda-runtime" }
serverless-core = { path = "../../crates/serverless-core" }
serverless-aws = { path = "../../crates/serverless-aws" }
config-loader = { path = "../../crates/config-loader" }
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
config-embed-build = { path = "../../crates/config-embed-build" }

[dev-dependencies]
light-security = { path = "../../crates/light-security", features = ["conformance-worker"] }
lambda_runtime.workspace = true
gateway-policy = { path = "../../crates/gateway-policy" }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
http.workspace = true
jsonwebtoken = "9.3"
tempfile = "3"
tokio-util.workspace = true
uuid.workspace = true

[[test]]
name = "l1"
path = "tests/l1/mod.rs"

[[bin]]
name = "validator-authenticated-qualification"
path = "src/bin/validator_authenticated_qualification.rs"
test = false
bench = false

[[bin]]
name = "validator-init-diagnostic-qualification"
path = "src/bin/validator_init_diagnostic_qualification.rs"
test = false
bench = false

[[bin]]
name = "validator-in-process"
path = "src/bin/validator_in_process.rs"
test = false
bench = false
