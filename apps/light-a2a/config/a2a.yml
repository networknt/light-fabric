  policyDigest: ${a2a.runtimePolicy.policyDigest:}
  audience: ${a2a.runtimePolicy.audience:light-a2a}
  host: ${a2a.runtimePolicy.host:}
  serviceId: ${a2a.runtimePolicy.serviceId:com.networknt.light-a2a-1.0.0}
  envTag: ${a2a.runtimePolicy.envTag:dev}
  contentDigest: ${a2a.runtimePolicy.contentDigest:}
  sourceEventSequence: ${a2a.runtimePolicy.sourceEventSequence:0}
  schemaVersion: ${a2a.runtimePolicy.schemaVersion:1}
  createdAt: ${a2a.runtimePolicy.createdAt:}
