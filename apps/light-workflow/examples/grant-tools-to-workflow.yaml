document:
  dsl: "1.0.3"
  namespace: light-portal
  name: grant-tools-to-workflow
  version: "1.0.0"
  title: Grant Tools to Workflow
  summary: Routes an exact workflow Tool access request to a GenAI administrator and acknowledges the author.
  tags:
    systemWorkflow: "true"
    purpose: workflow-tool-access
evaluate:
  language: cel
input:
  schema:
    format: json
    document:
      type: object
      required: [requestId, requestDigest, targetWfDefId, requesterUserId, justification, items]
      properties:
        requestId: { type: string, format: uuid }
        requestDigest: { type: string }
        targetWfDefId: { type: string, format: uuid }
        requesterUserId: { type: string, format: uuid }
        justification: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: object }
do:
  - reviewToolAccess:
      ask:
        prompt: Review the requested endpoint Tools, exact pins, environments, and usage locations.
        mode: approval
        assignment:
          roleId: genai-admin
          categoryCode: workflow-tool-access
          reasonCode: grant-tools-to-workflow
        options:
          - label: Approve
            value: APPROVE
          - label: Reject
            value: REJECT
        required: true
      metadata:
        humanTask:
          action: workflow-tool-access-decision
          commentRequired: true
      export:
        as:
          accessDecision: .output
      then: acknowledgeRequester
  - acknowledgeRequester:
      ask:
        prompt: Your workflow Tool access request has been decided. Review the decision and acknowledge it.
        mode: confirm
        assignment:
          userId: "${ .requesterUserId }"
          categoryCode: workflow-tool-access
          reasonCode: workflow-tool-access-acknowledgement
        options:
          - label: Acknowledge
            value: ACKNOWLEDGED
        required: true
      export:
        as:
          acknowledgement: .output
