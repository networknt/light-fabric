# Generic polling fixture: start an idempotent operation, inspect its result,
# wait without occupying a worker, then poll again. PT1S keeps tests short.
document:
  dsl: "1.0.3"
  namespace: workflow-examples
  name: operation-polling
  version: "1.0.0"
evaluate:
  language: cel
use:
  mcpSessions:
    gateway:
      server:
        endpoint:
          uri: https://polling-gateway.invalid/mcp
        transport: http
      reuse: true
do:
  - operation:
      call: mcp
      with:
        session: gateway
        tool: mock_operation_start
        arguments:
          requestKey: "${ .requestKey }"
      export:
        as:
          operation: .output.structuredContent
      retry:
        limit:
          attempt:
            count: 3
        delay:
          milliseconds: 0
      then: status
  - status:
      call: mcp
      with:
        session: gateway
        tool: mock_operation_status
        arguments:
          operationId: "${ .operation.operationId }"
      export:
        as:
          observed: .output.structuredContent
      then: terminalOrWait
  - terminalOrWait:
      switch:
        - ready:
            when: '.observed.state == "READY"'
            then: readyResult
        - pending:
            when: '.observed.state == "PENDING"'
            then: pollDelay
        - default:
            then: terminalResult
  - pollDelay:
      wait: PT1S
      then: status
  - readyResult:
      set:
        status: READY
        operationId: "${ .operation.operationId }"
        resultId: "${ .observed.resultId }"
        resultDigest: "${ .observed.resultDigest }"
      end: true
  - terminalResult:
      set:
        status: NOT_READY
        operationId: "${ .operation.operationId }"
        operationState: "${ .observed.state }"
      end: true
