[package]
name = "light-agent-worker"
default-run = "light-agent-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
claude-prototype = []

[dependencies]
serde = { workspace = true }
libc = "0.2"
task-workspace = { path = "../../crates/task-workspace" }
workspace-execution-protocol = { path = "../../crates/workspace-execution-protocol" }
agent-core = { path = "../../crates/agent-core" }
agent-runtime-protocol = { path = "../../crates/agent-runtime-protocol" }
agent-materializer = { path = "../../crates/agent-materializer" }
anyhow = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
coding-agent-runtime = { path = "../../crates/coding-agent-runtime" }
execution-security = { path = "../../crates/execution-security" }
execution-backend = { path = "../../crates/execution-backend" }
execution-runner-protocol = { path = "../../crates/execution-runner-protocol" }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
uuid = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
# start_paused: the bounded thread/archive test must not really wait out its timeout.
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "claude-coding"
required-features = ["claude-prototype"]

[[bin]]
name = "light-claude-worker"
path = "src/claude_code/main.rs"
required-features = ["claude-prototype"]
