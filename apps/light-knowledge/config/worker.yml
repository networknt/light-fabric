# Configuration schema version; intentionally fixed by this image.
version: 1
jobExecutionMode: ${knowledgeWorker.jobExecutionMode:embedded}
workerDatabaseUrlFile: ${knowledgeWorker.workerDatabaseUrlFile:/run/secrets/knowledge-worker-database-url}
expectedKnowledgeDatabase: ${knowledgeWorker.expectedKnowledgeDatabase:knowledge}
checkoutRoot: ${knowledgeWorker.checkoutRoot:/var/lib/light-knowledge/checkouts}
objectStoreRoot: ${knowledgeWorker.objectStoreRoot:/var/lib/light-knowledge/objects}
deterministicPilot: ${knowledgeWorker.deterministicPilot:false}
migrationDeterministicPilot: ${knowledgeWorker.migrationDeterministicPilot:false}
embeddingGatewayUrl: ${knowledgeWorker.embeddingGatewayUrl:https://llm-gateway:8443/v1/embeddings}
embeddingAuthorizationFile: ${knowledgeWorker.embeddingAuthorizationFile:/run/secrets/knowledge-index-embedding-authorization}
embeddingGatewayCaCertFile: ${knowledgeWorker.embeddingGatewayCaCertFile:/keystore/ca.pem}
embeddingGatewayVerifyHostname: ${knowledgeWorker.embeddingGatewayVerifyHostname:true}
embeddingAlias: ${knowledgeWorker.embeddingAlias:kb-index}
embeddingBatchSize: ${knowledgeWorker.embeddingBatchSize:32}
embeddingMigrationEnabled: ${knowledgeWorker.embeddingMigrationEnabled:false}
productionOperationsEnabled: ${knowledgeWorker.productionOperationsEnabled:false}
graphAssistedEnabled: ${knowledgeWorker.graphAssistedEnabled:false}
platformCaps:
  maximumDocuments: ${knowledgeWorker.platformCaps.maximumDocuments:10000}
  maximumChunks: ${knowledgeWorker.platformCaps.maximumChunks:100000}
  maximumSourceBytes: ${knowledgeWorker.platformCaps.maximumSourceBytes:268435456}
  maximumStoredBytes: ${knowledgeWorker.platformCaps.maximumStoredBytes:1073741824}
  maximumEmbeddingTokens: ${knowledgeWorker.platformCaps.maximumEmbeddingTokens:20000000}
  maximumSpendMicros: ${knowledgeWorker.platformCaps.maximumSpendMicros:10000000}
  maximumWallTimeSeconds: ${knowledgeWorker.platformCaps.maximumWallTimeSeconds:900}
  maximumConcurrency: ${knowledgeWorker.platformCaps.maximumConcurrency:8}
  maximumProviderCalls: ${knowledgeWorker.platformCaps.maximumProviderCalls:1024}
