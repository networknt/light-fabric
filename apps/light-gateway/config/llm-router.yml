# Local LLM data plane. It is inert unless both this flag and the `llm`
# handler are enabled. Provider topology and runtime material references are
# supplied through typed instance properties rendered into the immutable
# values.yml snapshot; this template contains no provider fixtures.
# The handler path must execute, in order:
# correlation -> unified-security -> limit -> access-control -> llm
enabled: ${llm-router.enabled:false}
pathPrefix: ${llm-router.pathPrefix:/v1}
# Admission bound for the raw HTTP request body captured by the application
# handler. This is not an exact predictor of canonical replay size.
maxRequestBodyBytes: ${llm-router.maxRequestBodyBytes:1048576}
maxJsonDepth: ${llm-router.maxJsonDepth:64}
# Bound for the serialized canonical request retained for retry replay. For a
# multi-attempt alias it must be at least maxRequestBodyBytes as a conservative
# reload check, and every canonical request is checked exactly before dispatch.
maxReplayBytes: ${llm-router.maxReplayBytes:1048576}
embeddingMemory:
  maxRequestBodyBytes: ${llm-router.embeddingMemory.maxRequestBodyBytes:4194304}
  maxReplayBytes: ${llm-router.embeddingMemory.maxReplayBytes:4194304}
  maxMemoryBytes: ${llm-router.embeddingMemory.maxMemoryBytes:17179869184}
  ingressConcurrency: ${llm-router.embeddingMemory.ingressConcurrency:32}
  maxIngressMemoryBytes: ${llm-router.embeddingMemory.maxIngressMemoryBytes:3221225472}
  # Covers worst-case tiny-string JSON expansion: 20x the wire body for
  # Value/Vec/String allocations plus 64 KiB fixed parser bookkeeping.
  ingressOverheadBytes: ${llm-router.embeddingMemory.ingressOverheadBytes:83951616}
  itemsPerPermit: ${llm-router.embeddingMemory.itemsPerPermit:256}
  maxInputBytesPerItem: ${llm-router.embeddingMemory.maxInputBytesPerItem:1048576}
  maxTotalInputBytes: ${llm-router.embeddingMemory.maxTotalInputBytes:4194304}
  bodyReadTimeoutMs: ${llm-router.embeddingMemory.bodyReadTimeoutMs:30000}
  minimumReceiveBytesPerSecond: ${llm-router.embeddingMemory.minimumReceiveBytesPerSecond:1024}
  authorizationTimeoutMs: ${llm-router.embeddingMemory.authorizationTimeoutMs:10000}
  writeTimeoutMs: ${llm-router.embeddingMemory.writeTimeoutMs:30000}
  minimumDrainBytesPerSecond: ${llm-router.embeddingMemory.minimumDrainBytesPerSecond:1024}
requestTimeoutMs: ${llm-router.requestTimeoutMs:30000}
globalConcurrency: ${llm-router.globalConcurrency:256}
globalStreamConcurrency: ${llm-router.globalStreamConcurrency:64}
streamChannelCapacity: ${llm-router.streamChannelCapacity:8}
maxStreamResponseBytes: ${llm-router.maxStreamResponseBytes:16777216}
streamWriteTimeoutMs: ${llm-router.streamWriteTimeoutMs:5000}
streamSetupTimeoutMs: ${llm-router.streamSetupTimeoutMs:10000}
streamIdleTimeoutMs: ${llm-router.streamIdleTimeoutMs:15000}
streamMinimumDrainBytesPerSecond: ${llm-router.streamMinimumDrainBytesPerSecond:128}
streamDrainGraceMs: ${llm-router.streamDrainGraceMs:1000}
developmentFixtures: ${llm-router.developmentFixtures:false}
# Explicitly enables non-public provider transports after their network-zone
# policy has been compiled from the same immutable snapshot.
localTransportEnabled: ${llm-router.localTransportEnabled:false}
# One gateway deployment serves one embedding admission lane. Deploy separate,
# network-restricted instances for kb_query and kb_index; a request header does
# not select this value. The 3 GiB ingress default above is a publication bound,
# not a preallocation; small-footprint instances should reduce
# ingressConcurrency and/or maxRequestBodyBytes with matching checked bounds.
embeddingWorkloadLane: ${llm-router.embeddingWorkloadLane:standard}

# OpenAI-only request fields may be allowlisted here. Mixed-format aliases use
# strictest-wins parsing: adding an Anthropic fallback causes these extensions
# to be rejected for the entire alias so every eligible fallback is encodable.
# The compiler emits a warning when that compatibility narrowing is present.
openaiExtensionAllowlist: ${llm-router.openaiExtensionAllowlist:[]}

# Optional public protocol facades. Keep disabled unless the corresponding
# handler paths and security rules are published for this gateway instance.
clientCompatibility:
  anthropicMessages: ${llm-router.clientCompatibility.anthropicMessages:false}

# Non-secret local materialization policy. Opaque credential and trust-bundle
# references are resolved locally; values.yml never contains secret bytes.
runtimeMaterial:
  requiredConformanceProvenance: ${llm-router.runtimeMaterial.requiredConformanceProvenance:captured_sanitized}
  credentialEnvironment: ${llm-router.runtimeMaterial.credentialEnvironment:{}}
  trustBundleFiles: ${llm-router.runtimeMaterial.trustBundleFiles:{}}
  evidencePublicKeys: ${llm-router.runtimeMaterial.evidencePublicKeys:{}}
  evidenceKeySetVersion: ${llm-router.runtimeMaterial.evidenceKeySetVersion:}
  evidenceKeySetDigest: ${llm-router.runtimeMaterial.evidenceKeySetDigest:}
  reasoningSeal: ${llm-router.runtimeMaterial.reasoningSeal:{}}

# Audited aliases use the bounded single-writer WAL. `required` aliases
# map to bounded-async; `local_durable` aliases additionally require
# persistentVolume=true and wait for attempt-start fdatasync before dispatch.
# Persistent network filesystems are not automatically equivalent: operators
# must verify that the mounted filesystem preserves flock exclusion, fdatasync
# durability, atomic rename, and crash recovery semantics before enabling
# local_durable. NFS or an unverified network volume must not be declared safe
# merely because it survives pod replacement.
# auditRuntime and its database credential rotate only through a gateway
# restart so two reload generations can never own the same WAL concurrently.
auditRuntime:
  directory: ${llm-router.auditRuntime.directory:data/llm-audit}
  gatewayInstance: ${llm_gateway_instance:gateway-local}
  hostId: ${llm-router.auditRuntime.hostId:host-local}
  maxRecordBytes: ${llm-router.auditRuntime.maxRecordBytes:4096}
  maxSegmentBytes: ${llm-router.auditRuntime.maxSegmentBytes:67108864}
  maxSpoolBytes: ${llm-router.auditRuntime.maxSpoolBytes:1073741824}
  queueRecords: ${llm-router.auditRuntime.queueRecords:8192}
  batchRecords: ${llm-router.auditRuntime.batchRecords:64}
  batchBytes: ${llm-router.auditRuntime.batchBytes:262144}
  commitDelayMs: ${llm-router.auditRuntime.commitDelayMs:5}
  terminalCommitBeforeResponse: ${llm-router.auditRuntime.terminalCommitBeforeResponse:false}
  persistentVolume: ${llm-router.auditRuntime.persistentVolume:false}
  # Set sinkDatabaseUrlEnv to the name (not value) of an environment variable
  # holding the separately credentialed dedicated-audit PostgreSQL URL.
  sinkDatabaseUrlEnv: ${llm-router.auditRuntime.sinkDatabaseUrlEnv:}
  sinkBatchRecords: ${llm-router.auditRuntime.sinkBatchRecords:256}
  sinkBatchBytes: ${llm-router.auditRuntime.sinkBatchBytes:1048576}
  sinkPollMs: ${llm-router.auditRuntime.sinkPollMs:100}
  sinkRetryMaxMs: ${llm-router.auditRuntime.sinkRetryMaxMs:10000}

networkZones: ${llm-router.networkZones:{}}
providers: ${llm-router.providers:{}}
deployments: ${llm-router.deployments:{}}
aliases: ${llm-router.aliases:{}}
