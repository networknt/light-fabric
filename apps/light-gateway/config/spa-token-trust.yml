# Configuration-owned RS256 authorities; configure only the roles in use.
# Internal defaults match the standard Portal light-oauth deployment. Explicit
# Portal values override them; Microsoft authorities require their own policy.
internal:
  issuer: ${spa-token-trust.internal.issuer:urn:com:networknt:oauth2:v1}
  audience: ${spa-token-trust.internal.audience:urn:com.networknt}
  jwksUri: ${spa-token-trust.internal.jwksUri:https://light-oauth:6881/oauth2/AZZRJE52eXu3t1hseacnGQ/keys}
  jwksCaPaths: ${spa-token-trust.internal.jwksCaPaths:/config/ca.pem}
  clockSkewSeconds: ${spa-token-trust.internal.clockSkewSeconds:60}
microsoftId:
  issuer: ${spa-token-trust.microsoftId.issuer:}
  audience: ${spa-token-trust.microsoftId.audience:}
  jwksUri: ${spa-token-trust.microsoftId.jwksUri:}
  jwksCaPaths: ${spa-token-trust.microsoftId.jwksCaPaths:}
  tenantId: ${spa-token-trust.microsoftId.tenantId:}
  clockSkewSeconds: ${spa-token-trust.microsoftId.clockSkewSeconds:60}
microsoftApi:
  issuer: ${spa-token-trust.microsoftApi.issuer:}
  audience: ${spa-token-trust.microsoftApi.audience:}
  jwksUri: ${spa-token-trust.microsoftApi.jwksUri:}
  jwksCaPaths: ${spa-token-trust.microsoftApi.jwksCaPaths:}
  tenantId: ${spa-token-trust.microsoftApi.tenantId:}
  requiredScopes: ${spa-token-trust.microsoftApi.requiredScopes:}
  allowedClientIds: ${spa-token-trust.microsoftApi.allowedClientIds:}
  clockSkewSeconds: ${spa-token-trust.microsoftApi.clockSkewSeconds:60}
