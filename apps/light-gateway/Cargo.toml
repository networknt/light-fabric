[package]
name = "light-gateway"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[dependencies]
operational-store = { path = "../../crates/operational-store" }
agent-delegation = { path = "../../crates/agent-delegation" }
gateway-operational-store = { path = "../../crates/gateway-operational-store" }
llm-gateway = { path = "../../crates/llm-gateway" }
light-runtime = { path = "../../crates/light-runtime" }
light-pingora = { path = "../../frameworks/light-pingora" }
config-loader = { path = "../../crates/config-loader" }
anyhow = { workspace = true }
arc-swap = "1.7"
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
pingora = { version = "=0.8.1", features = ["cache", "proxy", "rustls"] }
rustls-pemfile = "2.2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.8", features = ["chrono", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
h2 = "0.4"
hmac = { workspace = true }
hex = { workspace = true }
portal-registry = { path = "../../crates/portal-registry" }
rcgen = "0.14"
reqwest = { workspace = true, features = ["http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
socket2 = "0.6"
tempfile = "3"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.24" }

[build-dependencies]
config-embed-build = { path = "../../crates/config-embed-build" }
