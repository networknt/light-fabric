apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-knowledge-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: light-knowledge-worker
  template:
    metadata:
      labels:
        app: light-knowledge-worker
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: networknt/light-knowledge-worker:phase1a
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["build-loop"]
          env:
            - name: LIGHT_KNOWLEDGE_CONFIG_DIR
              value: /config
            - name: LIGHT_KNOWLEDGE_WORKER_CONFIG_FILE
              value: /config/worker.yml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: embedding-ca
              mountPath: /keystore
              readOnly: true
            - name: config-cache
              mountPath: /tmp/light-knowledge-config-cache
            - name: checkouts
              mountPath: /var/lib/light-knowledge/checkouts
            - name: objects
              mountPath: /var/lib/light-knowledge/objects
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: light-knowledge-worker-config
        - name: secrets
          secret:
            secretName: light-knowledge-secrets
            items:
              - key: knowledge-worker-database-url
                path: knowledge-worker-database-url
              - key: knowledge-index-embedding-authorization
                path: knowledge-index-embedding-authorization
        - name: embedding-ca
          secret:
            secretName: light-knowledge-embedding-ca
            items:
              - key: ca.pem
                path: ca.pem
        - name: config-cache
          emptyDir: {}
        - name: checkouts
          emptyDir:
            sizeLimit: 4Gi
        - name: objects
          persistentVolumeClaim:
            claimName: light-knowledge-objects
